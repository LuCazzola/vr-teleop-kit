[project]
name = "vr-teleop-kit"
version = "0.1.0"
description = "WebXR (Meta Quest) teleoperation kit for robot manipulators: WebSocket relay (client-server)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Luca Cazzola", email = "lcazzola@fbk.eu" }]
keywords = ["teleoperation", "webxr", "quest", "robotics", "lerobot", "inverse-kinematics"]
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "websockets>=13",
]

[project.optional-dependencies]
# The relay server (WebSocket broadcast + WebRTC camera streaming).
relay = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.10",
]
# The LeRobot Teleoperator adapter (examples additionally need the DK1
# driver — see the README, it installs from the trlc-dk1 repository).
lerobot = [
    "lerobot",
]
inspector = [
    "streamlit>=1.36",
    "pandas>=2.2",
]

[project.urls]
Repository = "https://github.com/LuCazzola/vr-teleop-kit"
[project.scripts]
vr-teleop-relay = "vr_teleop_kit.relay.server:main"
vr-teleop-inspector = "vr_teleop_kit.tools.controller_inspector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_teleop_kit"]